# schedule/jobs.conf — every scheduled loop of this Company OS (source of truth, per E5).
# Format (pipe-separated, spaces ignored):
#   job | cadence | task | enabled
#   job      = an agent slug (agents/<job>/AGENTS.md) or a system job: heartbeat · sync · standup
#   cadence  = every:<N>m | every:<N>h | daily:<HH:MM> | weekly:<mon..sun>:<HH:MM>
#   task     = optional explicit --task for run-agent.sh (empty = the agent's default mission)
#   enabled  = yes | no   (no = kept on file, not installed, never restarted by the heartbeat)
# Install / list / remove: bash scripts/schedule.sh install | list | uninstall
# Start small. Add a loop only after its manual run is proven (RULES R10).

heartbeat      | every:30m     |                                                            | yes
sync           | every:30m     |                                                            | yes
standup        | daily:07:30   |                                                            | yes
ops            | daily:07:00   | DAILY: costs + health of everything we run on; drifts → inboxes; report | yes
support        | every:60m     | SWEEP: new customer requests → drafts or escalation (never send unless the tier allows) | no
growth         | daily:09:00   | DAILY: pipeline + demand signals; proposals only, nothing published | no
finance        | daily:08:00   | DAILY: cash, receivables, spend vs baseline; alerts; nothing moved | no
quality        | daily:18:00   | DAILY: inspect what customers received today; file issues | no
